<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TV - Barbi</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .controle {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        button {
            font-size: 28px;
            padding: 20px 50px;
            cursor: pointer;
        }

        #status {
            font-size: 22px;
        }
    </style>
</head>

<body>

<div class="controle">

    <button onclick="iniciar()">INICIAR TV</button>

    <div id="status">
        Aguardando...
    </div>

</div>

<script>

const paginas = [

    "http://192.168.8.12:8088/barbi_producao/view/mapa_producao.html",

    "https://app.powerbi.com/reportEmbed?reportId=fef840a1-6ea7-4d28-bbc1-1c140ae215cf&autoAuth=true"

];

let janela = null;
let indice = 0;
let timer = null;

const TEMPO = 20000; // 20 segundos


function iniciar() {

    // Abre uma nova janela/aba.
    // Como isso acontece após o clique,
    // o navegador tende a permitir o popup.
    janela = window.open(
        "about:blank",
        "TV_BARBI"
    );

    if (!janela) {

        document.getElementById("status").innerHTML =
            "POPUP BLOQUEADO. Permita pop-ups para este site.";

        return;
    }

    // Primeira página
    indice = 0;

    abrirPagina();

    // Começa a alternância
    timer = setInterval(() => {

        indice++;

        if (indice >= paginas.length) {
            indice = 0;
        }

        abrirPagina();

    }, TEMPO);

}


function abrirPagina() {

    if (!janela || janela.closed) {

        clearInterval(timer);

        document.getElementById("status").innerHTML =
            "A janela da TV foi fechada.";

        return;
    }

    janela.location.href = paginas[indice];

    // Tenta colocar a janela em primeiro plano
    setTimeout(() => {

        try {
            janela.focus();
        } catch (e) {}

    }, 500);


    if (indice === 0) {

        document.getElementById("status").innerHTML =
            "CDI Indicadores — próxima troca em 20 segundos";

    } else {

        document.getElementById("status").innerHTML =
            "Power BI — próxima troca em 20 segundos";

    }

}

</script>

</body>
</html>
