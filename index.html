<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste iFractal</title>
</head>

<body>

    <h1>Teste</h1>

    <iframe
        id="teste"
        src="http://192.168.8.12:8088/barbi_producao/view/mapa_producao.html"
        style="
            position:fixed;
            top:50px;
            left:0;
            width:100%;
            height:calc(100% - 50px);
            border:0;
        ">
    </iframe>

    <script>

        const iframe = document.getElementById("teste");

        iframe.onload = function () {

            console.log("IFRAME CARREGOU");

            try {

                console.log(
                    "URL:",
                    iframe.contentWindow.location.href
                );

            } catch (erro) {

                console.log(
                    "Cross-origin:",
                    erro
                );

            }

        };

    </script>

</body>

</html>
