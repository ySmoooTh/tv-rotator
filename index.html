<head>
    <meta charset="UTF-8">

```
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TV Dashboard - Barbi</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    /* Todos os painéis ocupam exatamente a tela */
    .pagina {
        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        border: none;

        opacity: 0;

        visibility: hidden;

        transition: opacity 0.3s ease;

        background: #000;
    }

    /* Painel atualmente exibido */
    .pagina.ativo {
        opacity: 1;
        visibility: visible;

        z-index: 10;
    }

    /* Contador */
    #contador {

        position: fixed;

        right: 15px;
        bottom: 15px;

        background: rgba(0, 0, 0, 0.65);

        color: white;

        padding: 8px 12px;

        border-radius: 6px;

        font-family: Arial, sans-serif;

        font-size: 14px;

        z-index: 9999;
    }

</style>
```

</head>

<body>

```
<!-- PAINEL 1 -->
<iframe
    id="pagina0"
    class="pagina"
    src="https://app.powerbi.com/links/fGbAj4gcUx?ctid=cab9c926-253d-467a-aebe-7484b0e20d9a&pbi_source=linkShare&bookmarkGuid=10283f18-92ce-49c7-9f67-1548560a7bc3"
    allow="autoplay; fullscreen"
    allowfullscreen>
</iframe>


<!-- PAINEL 2 -->
<iframe
    id="pagina1"
    class="pagina"
    src="http://192.168.8.12:8088/barbi_producao/view/mapa_producao.html"
    allow="autoplay; fullscreen"
    allowfullscreen>
</iframe>


<!-- CONTADOR -->
<div id="contador">
    Carregando...
</div>


<script>

    /*
    ============================================================
    CONFIGURAÇÃO DOS PAINÉIS
    ============================================================
    */

    const paginas = [

        {
            nome: "Power BI",
            tempo: 120
        },

        {
            nome: "iFractal",
            tempo: 10
        }

    ];


    /*
    ============================================================
    CONTROLE
    ============================================================
    */

    let indice = 0;

    let tempoRestante = paginas[0].tempo;

    let intervalo;


    const contador =
        document.getElementById("contador");


    /*
    ============================================================
    MOSTRAR PAINEL
    ============================================================
    */

    function mostrarPagina() {

        /*
        Esconde todos
        */

        document
            .querySelectorAll(".pagina")
            .forEach(pagina => {

                pagina.classList.remove("ativo");

            });


        /*
        Mostra somente o atual
        */

        const paginaAtual =
            document.getElementById(
                "pagina" + indice
            );


        paginaAtual.classList.add("ativo");


        /*
        Reinicia contador
        */

        tempoRestante =
            paginas[indice].tempo;


        atualizarContador();


        /*
        Reinicia timer
        */

        clearInterval(intervalo);


        intervalo = setInterval(() => {

            tempoRestante--;

            atualizarContador();


            if (tempoRestante <= 0) {

                proximaPagina();

            }

        }, 1000);

    }


    /*
    ============================================================
    CONTADOR
    ============================================================
    */

    function atualizarContador() {

        contador.innerText =
            paginas[indice].nome +
            "  •  " +
            tempoRestante +
            "s";

    }


    /*
    ============================================================
    PRÓXIMA PÁGINA
    ============================================================
    */

    function proximaPagina() {

        clearInterval(intervalo);


        indice++;


        if (indice >= paginas.length) {

            indice = 0;

        }


        mostrarPagina();

    }


    /*
    ============================================================
    INICIA
    ============================================================
    */

    mostrarPagina();


    /*
    ============================================================
    TELA CHEIA
    ============================================================
    */

    document.addEventListener("click", () => {

        if (
            document.documentElement.requestFullscreen
        ) {

            document.documentElement
                .requestFullscreen()
                .catch(() => {});

        }

    });

</script>
```

</body>
</html>
